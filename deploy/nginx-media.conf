    # tv-proxy-media (BEGIN) -- see /opt/tv-proxy/docs/MEDIA.md
    # Recordings + videos, published via the tunnel (prefix stripped).
    location /media/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    # Short playlist URLs: tv-proxy-media builds them (fast) and appends the
    # recordings for MEDIA_MERGE_VIEWERS; other viewers are proxied unchanged.
    # /tv/<code>/<slug>.m3u8 streams do not match and still go to tv-proxy.
    location ~ ^/tv/[A-Za-z0-9_-]+$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 150s;
    }
    # Same live streams under a .ts URL (relayed by tv-proxy-media).
    location ~ ^/tv/[A-Za-z0-9_-]+/[A-Za-z0-9._-]+\.ts$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # tv-proxy-media (END)

